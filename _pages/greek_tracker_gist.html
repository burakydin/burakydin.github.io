// ---- Gist sync ----
async function gistRead(token,gistId){
  const r=await fetch(`https://api.github.com/gists/${gistId}`,{headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"}});
  if(!r.ok) throw new Error(`Gist read failed: ${r.status}`);
  const g=await r.json();
  const f=g.files?.["greek_tracker_data.json"];
  if(!f||!f.content) return null;
  return JSON.parse(f.content);
}

async function gistWrite(token,gistId,data){
  const body={files:{"greek_tracker_data.json":{content:JSON.stringify(data)}}};
  const r=await fetch(`https://api.github.com/gists/${gistId}`,{method:"PATCH",headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(`Gist write failed: ${r.status}`);
  return await r.json();
}

async function gistCreate(token){
  const body={description:"Greek Learning Tracker — auto-synced data","public":false,files:{"greek_tracker_data.json":{content:"{}"}}};
  const r=await fetch("https://api.github.com/gists",{method:"POST",headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(`Gist create failed: ${r.status}`);
  const g=await r.json();
  return g.id;
}

// ---- UI Components ----
function Badge({children,color="#5a7d6a"}){return <span style={{display:"inline-block",padding:"2px 8px",borderRadius:4,fontSize:11,fontWeight:600,background:color+"18",color,marginRight:4,marginBottom:2}}>{children}</span>;}

function SearchBar({value,onChange,placeholder}){return <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"10px 14px",border:"1px solid var(--border)",borderRadius:8,fontSize:14,background:"var(--card-bg)",color:"var(--text)",outline:"none",boxSizing:"border-box"}} />;}

function VocabPanel({vocab,setVocab}){const [search,setSearch]=useState("");const [filter,setFilter]=useState("all");const [adding,setAdding]=useState(false);const [form,setForm]=useState({greek:"",english:"",type:"noun",gender:"",plural:"",notes:""});const f=vocab.filter(v=>{const q=search.toLowerCase();return(v.greek.toLowerCase().includes(q)||v.english.toLowerCase().includes(q))&&(filter==="all"||v.type===filter);});const add=()=>{if(!form.greek.trim())return;setVocab(p=>[...p,{...form,id:uid()}]);setForm({greek:"",english:"",type:"noun",gender:"",plural:"",notes:""});setAdding(false);};const gc={masculine:"#3a6ea5",feminine:"#a5496b",neuter:"#5a7d6a"};return <div><div style={{display:"flex",gap:10,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}><div style={{flex:1,minWidth:180}}><SearchBar value={search} onChange={setSearch} placeholder="Search vocabulary..." /></div><div style={{width:130}}><Select value={filter} onChange={setFilter} options={[{value:"all",label:"All"},{value:"noun",label:"Nouns"},{value:"adjective",label:"Adj."},{value:"other",label:"Other"}]} /></div><Btn onClick={()=>setAdding(true)}>+ Add</Btn></div><div style={{fontSize:12,color:"var(--text-dim)",marginBottom:12}}>{f.length} word{f.length!==1?"s":""}</div><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8}}>{f.map(v=><div key={v.id} style={{background:"var(--card-bg)",borderRadius:10,padding:"12px 14px",border:"1px solid var(--border)",position:"relative"}}><div style={{fontSize:16,fontFamily:"'Literata',serif",marginBottom:2}}>{v.greek}</div><div style={{fontSize:13,color:"var(--text-dim)",marginBottom:6}}>{v.english}</div><Badge color={v.type==="noun"?"#3a6ea5":v.type==="adjective"?"#b07a2e":"#888"}>{v.type}</Badge>{v.gender&&<Badge color={gc[v.gender]||"#888"}>{v.gender}</Badge>}{v.plural&&<div style={{fontSize:11,color:"var(--text-dim)",marginTop:4}}>pl: {v.plural}</div>}{v.notes&&<div style={{fontSize:11,color:"var(--text-dim)",marginTop:2,fontStyle:"italic"}}>{v.notes}</div>}<button onClick={()=>setVocab(p=>p.filter(x=>x.id!==v.id))} style={{position:"absolute",top:8,right:10,background:"none",border:"none",color:"var(--text-dim)",cursor:"pointer",fontSize:16,opacity:0.4}}>×</button></div>)}</div><Modal open={adding} onClose={()=>setAdding(false)} title="Add Word"><Field label="Greek"><Input value={form.greek} onChange={e=>setForm(f=>({...f,greek:e.target.value}))} /></Field><Field label="English"><Input value={form.english} onChange={e=>setForm(f=>({...f,english:e.target.value}))} /></Field><Field label="Type"><Select value={form.type} onChange={v=>setForm(f=>({...f,type:v}))} options={[{value:"noun",label:"Noun"},{value:"adjective",label:"Adjective"},{value:"adverb",label:"Adverb"},{value:"other",label:"Other"}]} /></Field><Field label="Gender"><Select value={form.gender} onChange={v=>setForm(f=>({...f,gender:v}))} options={[{value:"",label:"—"},{value:"masculine",label:"ο"},{value:"feminine",label:"η"},{value:"neuter",label:"το"}]} /></Field><Field label="Plural"><Input value={form.plural} onChange={e=>setForm(f=>({...f,plural:e.target.value}))} /></Field><Field label="Notes"><Input value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} /></Field><div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:12}}><Btn variant="secondary" onClick={()=>setAdding(false)}>Cancel</Btn><Btn onClick={add}>Add</Btn></div></Modal></div>;}

function VerbPanel({verbs,setVerbs}){const [search,setSearch]=useState("");const [exp,setExp]=useState({});const [adding,setAdding]=useState(false);const [form,setForm]=useState({lemma:"",english:"",group:"1st",forms:[]});const [nf,setNf]=useState({form:"",tense:"",person:""});const f=verbs.filter(v=>v.lemma.toLowerCase().includes(search.toLowerCase())||v.english.toLowerCase().includes(search.toLowerCase()));const gc={"1st":"#5a7d6a","2nd":"#3a6ea5",irregular:"#a5496b",deponent:"#b07a2e"};return <div><div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center"}}><div style={{flex:1}}><SearchBar value={search} onChange={setSearch} placeholder="Search verbs..." /></div><Btn onClick={()=>setAdding(true)}>+ Add</Btn></div><div style={{fontSize:12,color:"var(--text-dim)",marginBottom:12}}>{f.length} verb{f.length!==1?"s":""}</div><div style={{display:"flex",flexDirection:"column",gap:8}}>{f.map(v=>{const o=exp[v.id];return <div key={v.id} style={{background:"var(--card-bg)",borderRadius:10,border:"1px solid var(--border)",overflow:"hidden"}}><div onClick={()=>setExp(e=>({...e,[v.id]:!e[v.id]}))} style={{padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><span style={{fontSize:17,fontFamily:"'Literata',serif"}}>{v.lemma}</span><span style={{fontSize:13,color:"var(--text-dim)",marginLeft:10}}>{v.english}</span></div><div style={{display:"flex",alignItems:"center",gap:8}}><Badge color={gc[v.group]||"#888"}>{v.group}</Badge><span style={{fontSize:12,color:"var(--text-dim)"}}>{v.forms.length}</span><span style={{transform:o?"rotate(90deg)":"none",transition:"0.15s",color:"var(--text-dim)"}}>▸</span></div></div>{o&&<div style={{padding:"0 16px 14px",borderTop:"1px solid var(--border)"}}>{v.forms.length>0&&<table style={{width:"100%",borderCollapse:"collapse",marginTop:10,fontSize:13}}><thead><tr style={{textAlign:"left",color:"var(--text-dim)",fontSize:11,textTransform:"uppercase"}}><th style={{padding:"6px 8 lue:"deponent",label:"Deponent"}]} /></Field><div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:12}}><Btn variant="secondary" onClick={()=>setAdding(false)}>Cancel</Btn><Btn onClick={()=>{if(!form.lemma.trim())return;setVerbs(p=>[...p,{...form,id:uid()}]);setForm({lemma:"",english:"",group:"1st",forms:[]});setAdding(false);}}>Add</Btn></div></Modal></div>;}

function QuizPanel({sentences,vocab}){const [mode,setMode]=useState("sentences");const [dir,setDir]=useState("gr2en");const [cur,setCur]=useState(null);const [ans,setAns]=useState("");const [res,setRes]=useState(null);const [score,setScore]=useState({c:0,t:0});const ref=useRef(null);const pool=mode==="sentences"?sentences:vocab;const next=useCallback(()=>{if(!pool.length)return;setCur(pool[Math.floor(Math.random()*pool.length)]);setAns("");setRes(null);setTimeout(()=>ref.current?.focus(),50);},[pool]);useEffect(()=>{next();},[mode,dir]);const check=()=>{if(!cur)return;const c=dir==="gr2en"?cur.english.toLowerCase().replace(/[.,;!?]/g,"").trim():cur.greek.toLowerCase().replace(/[.,;!?;]/g,"").trim();const g=ans.toLowerCase().replace(/[.,;!?;]/g,"").trim();const ok=g===c;setRes({ok,c:dir==="gr2en"?cur.english:cur.greek});setScore(s=>({c:s.c+(ok?1:0),t:s.t+1}));};const prompt=cur?(dir==="gr2en"?cur.greek:cur.english):"";return <div><div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}><Select value={mode} onChange={setMode} options={[{value:"sentences",label:"Sentences"},{value:"vocab",label:"Vocabulary"}]} /><Select value={dir} onChange={setDir} options={[{value:"gr2en",label:"Greek → English"},{value:"en2gr",label:"English → Greek"}]} /><div style={{marginLeft:"auto",fontSize:14,color:"var(--text-dim)",fontWeight:600}}>{score.c}/{score.t}{score.t>0&&<span style={{color:"var(--accent)"}}> ({Math.round(score.c/score.t*100)}%)</span>}</div></div>{cur?<div style={{background:"var(--card-bg)",borderRadius:14,padding:"28px 24px",border:"1px solid var(--border)",textAlign:"center"}}><div style={{fontSize:11,textTransform:"uppercase",letterSpacing:"0.08em",color:"var(--text-dim)",marginBottom:10}}>{dir==="gr2en"?"Translate to English":"Translate to Greek"}</div><div style={{fontSize:22,fontFamily:"'Literata',serif",marginBottom:20,lineHeight:1.5}}>{prompt}</div><div style={{maxWidth:360,margin:"0 auto"}}><Input ref={ref} value={ans} onChange={e=>setAns(e.target.value)} placeholder="Your answer..." onKeyDown={e=>{if(e.key==="Enter"){res?next():check();}}} style={{textAlign:"center",fontSize:16}} /></div>{res&&<div style={{marginTop:16,padding:"12px 16px",borderRadius:8,background:res.ok?"#d4edda":"#f8d7da",color:res.ok?"#155724":"#721c24",fontSize:14}}>{res.ok?"Correct! 🎉":<span>Not quite — <strong style={{fontFamily:"'Literata',serif"}}>{res.c}</strong></span>}</div>}<div style={{marginTop:16}}>{res?<Btn onClick={next}>Next →</Btn>:<Btn onClick={check}>Check</Btn>}</div></div>:<div style={{textAlign:"center",color:"var(--text-dim)",padding:40}}>No items.</div>}</div>;}

  const fRef=useRef(null);
  const saveKey=(k)=>{setApiKey(k);localStorage.setItem(KEYS.apiKey,k);};
  const handleFile=(f)=>{if(!f||!f.type.startsWith("image/"))return;setImage(f);setError(null);setParsed(null);setDone(false);const r=new FileReader();r.onload=e=>setPreview(e.target.result);r.readAsDataURL(f);};
  const analyze=async()=>{if(!image||!apiKey.trim())return;setLoading(true);setError(null);setParsed(null);setDone(false);
    try{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(image);});
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:image.type||"image/png",data:b64}},{type:"text",text:AI_PROMPT}]}]})});
      if(!resp.ok){const err=await resp.text();throw new Error(err);}
      const data=await resp.json();const text=data.content?.map(c=>c.text||"").join("")||"";const clean=text.replace(/```json\s*/g,"").replace(/```\s*/g,"").trim();const result=JSON.parse(clean);
      const eG=new Set(eSentences.map(s=>s.greek.toLowerCase().trim()));const eV=new Set(eVocab.map(v=>v.greek.toLowerCase().trim()));const eL=new Set(eVerbs.map(v=>v.lemma.toLowerCase().trim()));
      const nS=(result.sentences||[]).filter(s=>!eG.has(s.greek.toLowerCase().trim()));
      const nV=(result.vocab||[]).filter(v=>!eV.has(v.greek.toLowerCase().trim()));
      const nVb=(result.verbs||[]).filter(v=>!eL.has(v.lemma.toLowerCase().trim()));
      const uV=(result.verbs||[]).filter(v=>{const ex=eVerbs.find(ev=>ev.lemma.toLowerCase().trim()===v.lemma.toLowerCase().trim());if(!ex)return false;const ef=new Set(ex.forms.map(f=>f.form.toLowerCase()));return v.forms?.some(f=>!ef.has(f.form.toLowerCase()));}).map(v=>{const ex=eVerbs.find(ev=>ev.lemma.toLowerCase().trim()===v.lemma.toLowerCase().trim());const ef=new Set(ex.forms.map(f=>f.form.toLowerCase()));return{...v,forms:v.forms.filter(f=>!ef.has(f.form.toLowerCase())),eid:ex.id};});
      setParsed({s:nS,v:nV,vb:nVb,uv:uV});
      const ss={};nS.forEach((_,i)=>ss[i]=true);const sv={};nV.forEach((_,i)=>sv[i]=true);const svb={};nVb.forEach((_,i)=>svb[i]=true);const suv={};uV.forEach((_,i)=>suv[i]=true);
      setSel({s:ss,v:sv,vb:svb,uv:suv});
    }catch(e){console.error(e);setError("Failed: "+e.message.slice(0,200));}setLoading(false);};
  const doImport=()=>{if(!parsed)return;
    const ns=parsed.s.filter((_,i)=>sel.s[i]).map(s=>({...s,id:uid()}));if(ns.length)setSentences(p=>[...p,...ns]);
    const nv=parsed.v.filter((_,i)=>sel.v[i]).map(v=>({...v,id:uid()}));if(nv.length)setVocab(p=>[...p,...nv]);
    const nvb=parsed.vb.filter((_,i)=>sel.vb[i]).map(v=>({...v,id:uid()}));if(nvb.length)setVerbs(p=>[...p,...nvb]);
    const upd=parsed.uv.filter((_,i)=>sel.uv[i]);if(upd.length)setVerbs(p=>p.map(v=>{const u=upd.find(x=>x.eid===v.id);return u?{...v,forms:[...v.forms,...u.forms]}:v;}));
    setDone(true);};
  const total=parsed?(Object.values(sel.s).filter(Boolean).length+Object.values(sel.v).filter(Boolean).length+Object.values(sel.vb).filter(Boolean).length+Object.values(sel.uv).filter(Boolean).length):0;
  return <div>
    <div style={{fontSize:14,color:"var(--text-dim)",marginBottom:12,lineHeight:1.6}}>Upload a photo of Greek learning material. AI extracts sentences, vocabulary, and verbs.</div>
    <Field label="Anthropic API Key (stored locally only)">
      <Input type="password" value={apiKey} onChange={e=>saveKey(e.target.value)} placeholder="sk-ant-..." style={{fontFamily:"monospace",fontSize:12}} />
    </Field>
    <div onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);}} onDragOver={e=>e.preventDefault()} onClick={()=>fRef.current?.click()} style={{border:"2px dashed var(--border)",borderRadius:14,padding:preview?0:"40px 20px",textAlign:"center",cursor:"pointer",background:"var(--card-bg)",overflow:"hidden",position:"relative",marginTop:8}}>
      <input ref={fRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])} />
      {preview?<div style={{position:"relative"}}><img src={preview} alt="" style={{width:"100%",maxHeight:300,objectFit:"contain",display:"block"}} /><button onClick={e=>{e.stopPropagation();setImage(null);setPreview(null);setParsed(null);setDone(false);}} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,0.6)",color:"#fff",border:"none",borderRadius:"50%",width:28,height:28,cursor:"pointer",fontSize:16}}>×</button></div>:<div><div style={{fontSize:32,marginBottom:8}}>📸</div><div style={{fontSize:15,fontWeight:600}}>Drop image or click to upload</div></div>}
    </div>
    {image&&!parsed&&!loading&&<div style={{marginTop:14,textAlign:"center"}}><Btn onClick={analyze} style={{padding:"12px 32px",fontSize:15,opacity:apiKey.trim()?"1":"0.4"}}>✨ Analyze with AI</Btn>{!apiKey.trim()&&<div style={{fontSize:12,color:"#c44",marginTop:6}}>Enter your API key above first</div>}</div>}
    {loading&&<div style={{marginTop:20,textAlign:"center",color:"var(--text-dim)"}}><div className="sp" style={{width:32,height:32,border:"3px solid var(--border)",borderTopColor:"var(--accent)",borderRadius:"50%",margin:"0 auto 10px"}}></div><div>Analyzing image...</div></div>}
    {error&&<div style={{marginTop:14,padding:"12px 16px",borderRadius:8,background:"#f8d7da",color:"#721c24",fontSize:13}}>{error}</div>}
    {parsed&&!done&&<div style={{marginTop:16}}>
      <div style={{fontSize:16,fontFamily:"'Literata',serif",fontWeight:700,marginBottom:14}}>New items found</div>
      {parsed.s.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:13,fontWeight:700,color:"var(--accent)",marginBottom:8,textTransform:"uppercase"}}>Sentences ({parsed.s.length})</div>{parsed.s.map((s,i)=><label key={i} style={{display:"flex",gap:10,padding:"8px 12px",background:"var(--card-bg)",borderRadius:8,border:"1px solid var(--border)",marginBottom:6,cursor:"pointer"}}><input type="checkbox" checked={!!sel.s[i]} onChange={()=>setSel(p=>({...p,s:{...p.s,[i]:!p.s[i]}}))} style={{marginTop:4}} /><div><div style={{fontSize:15,fontFamily:"'Literata',serif"}}>{s.greek}</div><div style={{fontSize:13,color:"var(--text-dim)"}}>{s.english}</div></div></label>)}</div>}
      {parsed.v.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:13,fontWeight:700,color:"#5a7d6a",marginBottom:8,textTransform:"uppercase"}}>Vocabulary ({parsed.v.length})</div>{parsed.v.map((v,i)=><label key={i} style={{display:"flex",gap:10,padding:"8px 12px",background:"var(--card-bg)",borderRadius:8,border:"1px solid var(--border)",marginBottom:6,cursor:"pointer"}}><input type="checkbox" checked={!!sel.v[i]} onChange={()=>setSel(p=>({...p,v:{...p.v,[i]:!p.v[i]}}))} style={{marginTop:4}} /><div><span style={{fontSize:15,fontFamily:"'Literata',serif"}}>{v.greek}</span> <span style={{fontSize:13,color:"var(--text-dim)"}}>{v.english}</span></div></label>)}</div>}
      {parsed.vb.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:13,fontWeight:700,color:"#b07a2e",marginBottom:8,textTransform:"uppercase"}}>New Verbs ({parsed.vb.length})</div>{parsed.vb.map((v,i)=><label key={i} style={{display:"flex",gap:10,padding:"8px 12px",background:"var(--card-bg)",borderRadius:8,border:"1px solid var(--border)",marginBottom:6,cursor:"pointer"}}><input type="checkbox" checked={!!sel.vb[i]} onChange={()=>setSel(p=>({...p,vb:{...p.vb,[i]:!p.vb[i]}}))} style={{marginTop:4}} /><div><span style={{fontFamily:"'Literata',serif",fontWeight:600}}>{v.lemma}</span> <span style={{fontSize:13,color:"var(--text-dim)"}}>{v.english}</span></div></label>)}</div>}
      {parsed.uv.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:13,fontWeight:700,color:"#7a5fb0",marginBottom:8,textTransform:"uppercase"}}>New forms ({parsed.uv.length})</div>{parsed.uv.map((v,i)=><label key={i} style={{display:"flex",gap:10,padding:"8px 12px",background:"var(--card-bg)",borderRadius:8,border:"1px solid var(--border)",marginBottom:6,cursor:"pointer"}}><input type="checkbox" checked={!!sel.uv[i]} onChange={()=>setSel(p=>({...p,uv:{...p.uv,[i]:!p.uv[i]}}))} style={{marginTop:4}} /><div><span style={{fontFamily:"'Literata',serif",fontWeight:600}}>{v.lemma}</span><span style={{fontSize:12,color:"#7a5fb0",marginLeft:6}}>+{v.forms.length}</span></div></label>)}</div>}
      {total>0&&<div style={{display:"flex",gap:10,justifyContent:"flex-end"}}><Btn variant="secondary" onClick={()=>{setParsed(null);setImage(null);setPreview(null);}}>Cancel</Btn><Btn onClick={doImport}>Import {total}</Btn></div>}
    </div>}
    {done&&<div style={{textAlign:"center",padding:30}}><div style={{fontSize:40,marginBottom:12}}>✅</div><div style={{fontSize:18,fontFamily:"'Literata',serif",marginBottom:8}}>Import complete!</div><Btn onClick={()=>{setImage(null);setPreview(null);setParsed(null);setDone(false);}}>Import another</Btn></div>}
  </div>;
}

// ---- Sync Panel ----
function SyncPanel({ghToken,setGhToken,gistId,setGistId,syncStatus,onPull,onPush,onDisconnect}){
  const [tokenInput,setTokenInput]=useState(ghToken);
  const [setting,setSetting]=useState(false);
  const connect=async()=>{
    setSetting(true);
    try{
      const token=tokenInput.trim();
      if(!token) throw new Error("Token required");
      // test token
      const r=await fetch("https://api.github.com/user",{headers:{Authorization:`Bearer ${token}`}});
      if(!r.ok) throw new Error("Invalid token");
      // create or use existing gist
      let id=gistId;
      if(!id){id=await gistCreate(token);}
      setGhToken(token);setGistId(id);
      localStorage.setItem(KEYS.ghToken,token);localStorage.setItem(KEYS.gistId,id);
      onPush(token,id);
    }catch(e){alert("Connection failed: "+e.message);}
    setSetting(false);
  };
  const connected=!!(ghToken&&gistId);
  return <div>
    <div style={{fontSize:14,color:"var(--text-dim)",marginBottom:16,lineHeight:1.6}}>Sync your database to a private GitHub Gist so it works across all your devices.</div>
    {connected?<div>
      <div style={{background:"var(--card-bg)",borderRadius:12,padding:"20px",border:"1px solid var(--border)",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <span style={{width:10,height:10,borderRadius:"50%",background:"#4caf50",display:"inline-block"}}></span>
          <span style={{fontWeight:600}}>Connected to GitHub Gist</span>
        </div>
        <div style={{fontSize:12,color:"var(--text-dim)",marginBottom:4}}>Gist ID: <code style={{background:"var(--border)",padding:"2px 6px",borderRadius:4}}>{gistId}</code></div>
        <div style={{fontSize:12,color:"var(--text-dim)"}}>Changes auto-save within a few seconds.</div>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <Btn onClick={()=>onPull(ghToken,gistId)} style={{background:"#5a7d6a"}}>↓ Pull from Gist</Btn>
        <Btn onClick={()=>onPush(ghToken,gistId)}>↑ Push to Gist</Btn>
        <Btn variant="secondary" onClick={()=>{if(confirm("Disconnect? Your local data stays, but syncing stops.")){onDisconnect();}}}>Disconnect</Btn>
      </div>
      {syncStatus&&<div className="sync-pill" style={{marginTop:12,background:syncStatus.type==="ok"?"#d4edda":syncStatus.type==="saving"?"#fff3cd":"#f8d7da",color:syncStatus.type==="ok"?"#155724":syncStatus.type==="saving"?"#856404":"#721c24"}}>{syncStatus.msg}</div>}
    </div>:<div>
      <div style={{background:"var(--card-bg)",borderRadius:12,padding:"20px",border:"1px solid var(--border)",marginBottom:16}}>
        <div style={{fontSize:14,fontWeight:600,marginBottom:12}}>Setup (one-time)</div>
        <div style={{fontSize:13,color:"var(--text-dim)",marginBottom:12,lineHeight:1.6}}>
          1. Go to <a href="https://github.com/settings/tokens/new" target="_blank" rel="noopener" style={{color:"var(--accent)"}}>github.com/settings/tokens</a> → Generate a <strong>classic</strong> token<br/>
          2. Select only the <code style={{background:"var(--border)",padding:"1px 4px",borderRadius:3}}>gist</code> scope<br/>
          3. Paste the token below
        </div>
        <Field label="GitHub Personal Access Token">
          <Input type="password" value={tokenInput} onChange={e=>setTokenInput(e.target.value)} placeholder="ghp_..." style={{fontFamily:"monospace",fontSize:12}} />
        </Field>
        <Btn onClick={connect} disabled={setting} style={{marginTop:4}}>{setting?"Connecting...":"Connect & Create Gist"}</Btn>
      </div>
    </div>}
  </div>;
}

// ---- Main App ----
function App(){
  const [tab,setTab]=useState("sentences");
  const [sentences,setSentences]=useState(()=>{const v=loadLS(KEYS.version,0);if(v<DATA_VERSION){saveLS(KEYS.version,DATA_VERSION);saveLS(KEYS.sentences,INITIAL_SENTENCES);return INITIAL_SENTENCES;}return loadLS(KEYS.sentences,INITIAL_SENTENCES);});
  const [vocab,setVocab]=useState(()=>{const v=loadLS(KEYS.version,0);if(v<DATA_VERSION){saveLS(KEYS.vocab,INITIAL_VOCAB);return INITIAL_VOCAB;}return loadLS(KEYS.vocab,INITIAL_VOCAB);});
  const [verbs,setVerbs]=useState(()=>{const v=loadLS(KEYS.version,0);if(v<DATA_VERSION){saveLS(KEYS.verbs,INITIAL_VERBS);return INITIAL_VERBS;}return loadLS(KEYS.verbs,INITIAL_VERBS);});

  const [ghToken,setGhToken]=useState(()=>localStorage.getItem(KEYS.ghToken)||"");
  const [gistId,setGistId]=useState(()=>localStorage.getItem(KEYS.gistId)||"");
  const [syncStatus,setSyncStatus]=useState(null);
  const saveTimer=useRef(null);
  const dataRef=useRef({sentences,vocab,verbs});

  // Keep ref in sync
  useEffect(()=>{dataRef.current={sentences,vocab,verbs};},[sentences,vocab,verbs]);

  // Save to localStorage on change
  useEffect(()=>{saveLS(KEYS.sentences,sentences);},[sentences]);
  useEffect(()=>{saveLS(KEYS.vocab,vocab);},[vocab]);
  useEffect(()=>{saveLS(KEYS.verbs,verbs);},[verbs]);

  // Debounced gist save
  useEffect(()=>{
    if(!ghToken||!gistId) return;
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      setSyncStatus({type:"saving",msg:"Saving..."});
      try{
        await gistWrite(ghToken,gistId,{sentences:dataRef.current.sentences,vocab:dataRef.current.vocab,verbs:dataRef.current.verbs,version:DATA_VERSION});
        setSyncStatus({type:"ok",msg:"Saved ✓"});
        setTimeout(()=>setSyncStatus(null),3000);
      }catch(e){setSyncStatus({type:"err",msg:"Save failed"});}
    },2000);
    return ()=>clearTimeout(saveTimer.current);
  },[sentences,vocab,verbs,ghToken,gistId]);

  // Pull from gist on first load if connected
  useEffect(()=>{
    if(!ghToken||!gistId) return;
    (async()=>{
      try{
        const data=await gistRead(ghToken,gistId);
        if(data&&data.sentences){
          setSentences(data.sentences);setVocab(data.vocab);setVerbs(data.verbs);
          setSyncStatus({type:"ok",msg:"Loaded from Gist ✓"});
          setTimeout(()=>setSyncStatus(null),3000);
        }
      }catch(e){console.error("Gist pull failed",e);}
    })();
  },[]);

  const onPull=async(t,g)=>{
    setSyncStatus({type:"saving",msg:"Pulling..."});
    try{const data=await gistRead(t,g);if(data&&data.sentences){setSentences(data.sentences);setVocab(data.vocab);setVerbs(data.verbs);setSyncStatus({type:"ok",msg:"Pulled ✓"});setTimeout(()=>setSyncStatus(null),3000);}else{setSyncStatus({type:"err",msg:"Gist is empty"});}}catch(e){setSyncStatus({type:"err",msg:"Pull failed"});}
  };
  const onPush=async(t,g)=>{
    setSyncStatus({type:"saving",msg:"Pushing..."});
    try{await gistWrite(t,g,{sentences,vocab,verbs,version:DATA_VERSION});setSyncStatus({type:"ok",msg:"Pushed ✓"});setTimeout(()=>setSyncStatus(null),3000);}catch(e){setSyncStatus({type:"err",msg:"Push failed"});}
  };
  const onDisconnect=()=>{setGhToken("");setGistId("");localStorage.removeItem(KEYS.ghToken);localStorage.removeItem(KEYS.gistId);setSyncStatus(null);};

  const stats={s:sentences.length,v:vocab.length,vb:verbs.length};
  const connected=!!(ghToken&&gistId);

  return <div style={{minHeight:"100vh",background:"var(--bg)",padding:"24px 16px"}}>
    <div style={{maxWidth:720,margin:"0 auto"}}>
      <div style={{marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:8}}>
        <h1 style={{fontFamily:"'Literata',serif",fontSize:28,fontWeight:700,margin:0,lineHeight:1.2}}>Ελληνικά <span style={{fontSize:16,fontWeight:400,color:"var(--text-dim)"}}>learning tracker</span></h1>
        <div className="stat-bar" style={{display:"flex",gap:14,fontSize:12,color:"var(--text-dim)",alignItems:"center"}}>
          {connected&&syncStatus&&<span className="sync-pill" style={{background:syncStatus.type==="ok"?"#d4edda":syncStatus.type==="saving"?"#fff3cd":"#f8d7da",color:syncStatus.type==="ok"?"#155724":syncStatus.type==="saving"?"#856404":"#721c24"}}>{syncStatus.msg}</span>}
          {connected&&!syncStatus&&<span className="sync-pill" style={{background:"#d4edda",color:"#155724"}}>synced</span>}
          <span><strong style={{color:"var(--accent)",fontSize:16}}>{stats.s}</strong> sentences</span>
          <span><strong style={{color:"var(--accent2)",fontSize:16}}>{stats.v}</strong> words</span>
          <span><strong style={{color:"#b07a2e",fontSize:16}}>{stats.vb}</strong> verbs</span>
        </div>
      </div>
      <div className="tab-bar" style={{display:"flex",borderBottom:"2px solid var(--border)",marginBottom:20,flexWrap:"wrap"}}>
        {[["sentences","Sentences"],["vocab","Vocabulary"],["verbs","Verbs"],["quiz","Quiz"],["import","Import"],["sync","⚙ Sync"]].map(([k,l])=><Tab key={k} label={l} active={tab===k} onClick={()=>setTab(k)} accent={k==="import"?"#7a5fb0":k==="sync"?"#5a7d6a":undefined} />)}
      </div>
      {tab==="sentences"&&<SentencePanel sentences={sentences} setSentences={setSentences} />}
      {tab==="vocab"&&<VocabPanel vocab={vocab} setVocab={setVocab} />}
      {tab==="verbs"&&<VerbPanel verbs={verbs} setVerbs={setVerbs} />}
      {tab==="quiz"&&<QuizPanel sentences={sentences} vocab={vocab} />}
      {tab==="import"&&<ImportPanel setSentences={setSentences} setVocab={setVocab} setVerbs={setVerbs} eSentences={sentences} eVocab={vocab} eVerbs={verbs} />}
      {tab==="sync"&&<SyncPanel ghToken={ghToken} setGhToken={setGhToken} gistId={gistId} setGistId={setGistId} syncStatus={syncStatus} onPull={onPull} onPush={onPush} onDisconnect={onDisconnect} />}
    </div>
  </div>;
}

ReactDOM.render(<App />,document.getElementById("root"));
</script>
{% endraw %}
</body>
</html>
