- title: Energy and Commodities Markets
  type: teaching_course
  course: ORF 455 / ENE 455 and ORF 555
  offerings:
  - term: Fall 2026
    instructor: Prof. Ronnie Sircar
  - term: Fall 2025
    instructor: Prof. Ronnie Sircar
  description: 'This course is an introduction to commodities markets (energy, metals, agricultural products) and issues related to renewable energy sources such as solar and wind power, and carbon emissions. Energy and other commodities represent an increasingly important asset class, in addition to significantly impacting the economy and policy decisions. Emphasis will be on the term structure of commodity prices: behavior, models and empirical issues.'
- title: Computing and Optimization for Physical and Social Sciences
  type: teaching_course
  course: ORF 363 / COS 323
  offerings:
  - term: Spring 2026
    instructor: Dr. Ioannis Akrotirianakis
  - term: Spring 2025
    instructor: Dr. Ioannis Akrotirianakis
  - term: Fall 2024
    instructor: Prof. Amir Ali Ahmadi
  description: An introduction to several fundamental and practically-relevant areas of modern optimization and numerical computing. Topics include computational linear algebra, first and second order descent methods, convex sets and functions, basics of linear and semidefinite programming, optimization for statistical regression and classification, and techniques for dealing with uncertainty and intractability in optimization problems. Extensive hands-on experience with high-level optimization software. Applications drawn from operations research, statistics and machine learning, economics, control theory, and engineering.
